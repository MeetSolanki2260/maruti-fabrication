name: ci
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    env: { NEXT_PUBLIC_SITE_URL: "https://example.workers.dev", NEXT_PUBLIC_TURNSTILE_SITEKEY: "1x00000000000000000000AA" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
